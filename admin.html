<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Sonido Vivo</title>
   
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
   
    <header class="header-principal">
        <div class="contenedor header-contenido">
            <h1 class="logo">Sonido <span>Vivo</span></h1>
            <nav class="navegacion-principal">
                <a href="index.html">Catálogo</a>
                <a href="carrito.html">Carrito</a>
                <a href="admin.html" class="active">Administración</a>
            </nav>
        </div>
    </header>
    
    <main class="contenedor">
        <section class="admin-section" style="margin-top: 40px; margin-bottom: 40px;">
            <h2>Panel de Administración de Productos</h2>
            <button id="btn-nuevo-producto" class="btn-accion" style="margin-bottom: 20px; padding: 10px 20px; cursor: pointer;">
                + Añadir Nuevo Producto
            </button>
            
            
            <table class="tabla-admin" style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead style="background-color: #333; color: white;">
                    <tr>
                        <th style="padding: 10px;">Código</th>
                        <th style="padding: 10px;">Nombre</th>
                        <th style="padding: 10px;">Categoría</th>
                        <th style="padding: 10px;">Stock</th>
                        <th style="padding: 10px;">Precio</th>
                        <th style="padding: 10px;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos-body">
                    
                </tbody>
            </table>
        </section>

        
        <div id="modal-agregar-producto" class="modal-overlay" style="display: none;">
            <div class="modal-contenido">
                <div class="modal-header">
                    <h3>Añadir Nuevo Producto</h3>
                    <button id="btn-cerrar-modal" class="btn-cerrar">&times;</button>
                </div>
                
                <form id="form-producto" novalidate>
                    <div class="form-grupo">
                        <label for="input-codigo">Código del Producto:</label>
                        <input type="text" id="input-codigo" placeholder="Ej: GA006" autocomplete="off">
                        <span id="error-codigo" class="msj-error"></span>
                    </div>
                    
                    <div class="form-grupo">
                        <label for="input-nombre">Nombre:</label>
                        <input type="text" id="input-nombre" placeholder="Nombre del instrumento" autocomplete="off">
                        <span id="error-nombre" class="msj-error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="input-marca">Marca:</label>
                            <input type="text" id="input-marca" placeholder="Ej: Yamaha" autocomplete="on">
                            <span id="error-marca" class="msj-error"></span>
                        </div>
                        <div class="form-grupo">
                            <label for="input-modelo">Modelo:</label>
                            <input type="text" id="input-modelo" placeholder="Ej: F310" autocomplete="off">
                            <span id="error-modelo" class="msj-error"></span>
                        </div>
                    </div>

                    <div class="form-grupo">
                        <label for="select-categoria-admin">Categoría:</label>
                        <select id="select-categoria-admin">
                            <option value="">Seleccione una categoría...</option>
                            <option value="Guitarras Acústicas">Guitarras Acústicas</option>
                            <option value="Guitarras Eléctricas">Guitarras Eléctricas</option>
                            <option value="Bajos Eléctricos">Bajos Eléctricos</option>
                            <option value="Baterías">Baterías</option>
                            <option value="Teclados y Pianos">Teclados y Pianos</option>
                            <option value="Amplificadores">Amplificadores</option>
                            <option value="Micrófonos">Micrófonos</option>
                            <option value="Pedales de Efectos">Pedales de Efectos</option>
                            <option value="Accesorios">Accesorios</option>
                            <option value="Estudio y Grabación">Estudio y Grabación</option>
                        </select>
                        <span id="error-categoria" class="msj-error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-grupo">
                            <label for="input-precio">Precio ($):</label>
                            <input type="number" id="input-precio" min="1" placeholder="Ej: 150000">
                            <span id="error-precio" class="msj-error"></span>
                        </div>
                        <div class="form-grupo">
                            <label for="input-stock">Stock Inicial:</label>
                            <input type="number" id="input-stock" min="0" placeholder="Ej: 10">
                            <span id="error-stock" class="msj-error"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-guardar">Guardar Producto</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor footer-contenido">
           <p>&copy; 2026 Sonido Vivo - Viña del Mar, Región de Valparaíso</p>
        </div>
    </footer>

    
    <script src="js/productos.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
